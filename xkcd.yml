name: Update xkcd JSON

on:
  schedule:
    # Runs daily at 14:05 UTC (~7:05am Denver standard / ~8:05am Denver daylight)
    - cron: "5 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest xkcd JSON
        run: |
          curl -sS https://xkcd.com/info.0.json -o xkcd-latest.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xkcd-latest.json
          git diff --cached --quiet || git commit -m "Update xkcd-latest.json"
          git push