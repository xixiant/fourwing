<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>xkcd</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    img { max-width: 100%; height: auto; }
    .alt { margin-top: .5rem; font-size: .85rem; opacity: .8; }
  </style>
</head>
<body>
  <div id="comic"></div>

  <script>
    const today = new Date().getDay();     // 0=Sun … 6=Sat
    const releaseDays = [0, 1, 3, 5];         // Mon/Wed/Fri

    if (releaseDays.includes(today)) {
      fetch("/xkcd-latest.json", { cache: "no-store" })
        .then(r => r.json())
        .then(data => {
          document.getElementById("comic").innerHTML = `
            <img src="${data.img}" alt="${data.alt}">
            <div class="alt">${data.alt}</div>
          `;
        });
    }
    // else: intentionally render nothing
  </script>
</body>
</html>
