<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>xkcd</title>
  <style>
    body {
      margin: 0;
      background: rgba(255,255,255,0.85); /* TEMP: force visibility */
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    img { max-width: 100%; height: auto; }
    .alt { margin: .5rem 1rem; font-size: .9rem; opacity: .85; }
    .status { padding: .75rem 1rem; font-size: .95rem; }
    .err { white-space: pre-wrap; padding: .75rem 1rem; font-size: .9rem; }
  </style>
</head>
<body>
  <div id="status" class="status">Loaded HTML. Starting JS…</div>
  <div id="comic"></div>
  <div id="err" class="err"></div>

  <script>
    const statusEl = document.getElementById("status");
    const comicEl = document.getElementById("comic");
    const errEl = document.getElementById("err");

    const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const today = new Date().getDay(); // 0..6
    const releaseDays = [0, 1, 3, 5];  // TEMP: include Sunday for testing

    statusEl.textContent = `JS running. Today: ${dayNames[today]} (${today}). releaseDays=${JSON.stringify(releaseDays)}`;

    if (!releaseDays.includes(today)) {
      statusEl.textContent += " — Not a show day; intentionally not fetching.";
    } else {
      const url = "/xkcd-latest.json"; // absolute path avoids relative-path surprises
      statusEl.textContent += ` — Fetching ${url} …`;

      fetch(url, { cache: "no-store" })
        .then(r => {
          statusEl.textContent += ` HTTP ${r.status}.`;
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then(data => {
          statusEl.textContent += ` Got comic #${data.num}. Rendering…`;
          comicEl.innerHTML = `
            <div><strong>${data.title}</strong></div>
            <img src="${data.img}" alt="${data.alt}">
            <div class="alt">${data.alt}</div>
          `;
          statusEl.textContent += " Done.";
        })
        .catch(err => {
          statusEl.textContent += " Failed.";
          errEl.textContent = "Error:\n" + String(err);
          console.error(err);
        });
    }
  </script>
</body>
</html>
