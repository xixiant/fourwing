<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>xkcd (release days only)</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    .alt {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="comic"></div>

  <script>
    const today = new Date().getDay(); 
    // 1 = Monday, 3 = Wednesday, 5 = Friday
    const releaseDays = [0, 1, 3, 5];

    if (releaseDays.includes(today)) {
      fetch("https://xkcd.com/info.0.json")
        .then(r => r.json())
        .then(data => {
          document.getElementById("comic").innerHTML = `
            <img src="${data.img}" alt="${data.alt}">
            <div class="alt">${data.alt}</div>
          `;
        });
    }
    // else: intentionally do nothing
  </script>
</body>
</html>
